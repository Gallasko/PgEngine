# A fight of a walk, in one column: fight.yaml for a window too narrow for its three. The same
# pieces under the same names, so LifeScene fills both the same way (lifewalk.cpp): the head,
# then every panel one under the other in a column that scrolls, what he may do first, then who
# fights, and the account. The order of the turn has no room here: the line under the head says
# who acts first, and the one under it what is coming. The scene writes the window's width over
# the widths drawn here before it builds the page (shapeWalk).
# z: the Overlay band, 100-129 (the veil 100, the head and the panels 104, their content 114).
name: fight
children:

  - kind: Shape2D
    name: veil
    width: 390
    height: 800
    z: 100
    theme: scene.background

  - {kind: Label, name: kicker, x: 16, y: 10, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 358, text: "THE HOLLOW WOODS · DAY 12 · A FIGHT"}
  - {kind: Label, name: fightTitle, x: 16, y: 28, z: 104, style: heading, overflow: ellipsis, width: 200, text: Wolf pack}

  - kind: Label
    name: turn
    z: 104
    style: figure-xl
    overflow: ellipsis
    width: 170
    align: right
    text: "TURN 4"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - {kind: Label, name: turnNote, x: 16, y: 64, z: 104, style: label, color: status-time, overflow: ellipsis, width: 358, text: "FIGHT COST · 3 TURNS = 1 DAY · 2 DAYS SO FAR · 17 DAYS LEFT ON SITE"}
  - {kind: Label, name: quick, x: 16, y: 86, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 358, text: "QUICKNESS 11 AGAINST 9: HE ACTS FIRST"}
  - {kind: Label, name: warn, x: 16, y: 108, z: 104, style: label, color: vermilion, overflow: ellipsis, width: 358, text: "2 BITES COMING · 8–14 IF ALL LAND"}

  - kind: Layout:Vertical
    name: walkLeft
    x: 16
    y: 150
    z: 104
    width: 362
    height: 640
    scrollable: true
    spacing: 12
    children:
      - kind: Panel
        name: previewPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: If he does this
        glyph: quill
        children:
          - {kind: Label, name: previewTitle, style: title, overflow: wrap, text: Heavy cut}
          - {kind: Label, name: previewText, style: body, overflow: wrap, text: "A slow, full blow."}
          - kind: ResourceLedger
            name: preview
          - {kind: Label, name: odds, style: gloss, color: ink-muted, overflow: wrap, text: "Kills it thrice in 5. A miss means a free bite."}
          - kind: Button
            name: act
            variant: seal
            label: Strike
            glyph: swordsmanship
            tag: walk.act
          - kind: Button
            name: hand
            variant: quiet
            label: "Let the stance choose, this turn and after"
            glyph: time
            tag: walk.hand

      - kind: Panel
        name: menuPanel
        frame: ruled
        width: 616
        z: 104
        contentZ: 114
        heading: His turn
        glyph: swordsmanship
        children:
          - kind: ActivityList
            name: targets
            id: walk.targets
            stripes: false
            compact: true
            tileWidth: 148
          - kind: ActivityList
            name: menu
            id: walk.menu
            stripes: false
            compact: true
            tileWidth: 148

      - kind: Panel
        name: heroPanel
        frame: ruled
        width: 280
        z: 104
        contentZ: 114
        heading: Aldren
        glyph: strength
        children:
          - {kind: Label, name: heroVit, style: label, overflow: wrap, text: "VITALITY 49 OF 90"}
          - {kind: ProgressRule, name: heroBar, nib: false, percent: 54}
          - {kind: Label, name: low, style: label, color: vermilion, overflow: wrap, text: ""}
          - {kind: Label, name: breath, style: label, color: lapis, overflow: wrap, text: "BREATH 3 OF 5"}
          - {kind: ProgressRule, name: breathBar, nib: false, small: true, percent: 60}
          - kind: ResourceLedger
            name: hero
          - {kind: Label, name: stance, style: label, color: ink-muted, overflow: wrap, text: BALANCED STANCE}

      - kind: Panel
        name: foePanel
        frame: hair
        width: 280
        z: 104
        contentZ: 114
        heading: Wolf
        glyph: adventure
        children:
          - kind: ResourceLedger
            name: foe

      - kind: Panel
        name: accountPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The account
        glyph: quill
        children:
          - kind: EventLog
            name: account
            height: 300
            years: false
            steps: true          # the first column counts: a step of the record, a turn of the fight
          - {kind: Label, name: footnote, style: label, color: status-time, overflow: wrap, text: "WRITTEN SO FAR · 2 DAYS · −14 VITALITY · A RETREAT KEEPS THE DAYS"}
