# The Life screen, compact: the same page for a small window (800x600 and up).
#
# LifeScene builds this file instead of life.yaml when the window is too small for three columns,
# and swaps back when it grows. The names are the same contract (see life.yaml); what is not here
# (the "about" line) simply has no widget.
#
# Margins 24. The head holds on two lines: the title with the age at its right, then the year
# with the note on the age. Under the tabs, two columns: on the left the work at hand over the
# choice, which takes the window's width and height; on the right a column of 320 showing one
# panel at a time - his parts, what he holds, the years, the log - picked by the small tabs on
# top of it. The side panels have no heading: the tab names them. His Vitality leads his parts,
# the panel the side column opens on; the doors (the WindowMeters) are not on this page. The scene sets the widths,
# the heights and which side panel shows on every resize. z: page 0, panels 10, content 20.
name: life
children:

  - kind: Shape2D
    name: page
    width: 800
    height: 600
    z: 0
    theme: scene.background

  # ── Head: who and how old on one line, the year under it ──────────────────────
  - kind: Label
    name: title
    x: 24
    y: 16
    style: title
    overflow: ellipsis
    width: 632
    text: The Chronicle of Aldren of Bellmoor

  - kind: Label
    name: age
    style: figure-xl
    overflow: ellipsis
    width: 120
    align: right
    text: "17.5"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 16}

  - kind: Label
    name: subtitle
    x: 24
    y: 54
    style: label
    color: ink-muted
    text: "THE SEVENTEENTH YEAR · SPRING · BELLMOOR"

  - kind: Label
    name: ageNote
    style: body-sm
    color: ink-muted
    overflow: ellipsis
    width: 300
    align: right
    text: years · 7 mo to the eighteenth
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 54}

  - kind: Tabs
    name: tabs
    x: 24
    y: 72
    tag: life.tabs
    items:
      - {label: Life, glyph: quill}
      - {label: Town, glyph: town}      # not open until a life has explored the town
      - {label: Adventure, glyph: adventure}   # not there until he has somewhere to walk to
      # Kit, Guild and Chronicle come back as their pages are built

  # ── Main: the work at hand, then the choice ───────────────────────────────────
  - kind: Panel
    name: working
    x: 24
    y: 128
    frame: ruled
    width: 436
    heading: At work now
    glyph: quill
    aside: RUNNING
    children:
      - kind: ActivityList
        name: running
        id: life.running
      # A life that has done nothing yet: what to do, over the button that does it. One line, and
      # gone with the first work begun
      - {kind: Label, name: guide, style: body-sm, color: ink-muted, overflow: ellipsis, text: "Choose a work, then press Begin"}
      # At nothing, a month passes only when he says so: shown while idle, in the row's place
      - kind: Button
        name: skip
        variant: quiet
        label: Pass a month
        glyph: time
        months: 1
        tag: life.skip
      # What is chosen in the list begins from here: in the place of the button above while a
      # tile is chosen, so that nobody has to know that a second click or Enter begins it too
      - kind: Button
        name: begin
        variant: seal
        label: Begin
        glyph: quill
        months: 3
        tag: life.begin
      # The room of the button that spends written time (`haste`, after the panel) under a running
      # row: it has the line of Go on, Begin or Pass a month when one of them stands
      - kind: Layout:Horizontal
        name: hasteRow
        width: 1
        height: 36

  # Written time, spent to run the months faster: a press goes ×1, ×2, ×3 and back. Shown while
  # any is held (in his Inventory), at the right of "At work now", on the line of its last button
  - kind: Button
    name: haste
    variant: quiet
    label: "Months ×1"
    glyph: time
    tag: life.haste
    z: 20
    anchors:
      - {side: right, target: working, targetSide: right, margin: 16}
      - {side: bottom, target: working, targetSide: bottom, margin: 16}

  - kind: Panel
    name: may
    frame: ruled
    width: 436
    heading: Activities
    glyph: town
    aside: CHOOSE ONE
    anchors:
      - {side: top, target: working, targetSide: bottom, margin: 16}
      - {side: left, target: working, targetSide: left}
    children:
      - kind: ActivityList
        name: activities
        id: life.activities
        height: 200
        stripes: false
        compact: true         # a row is its name, its time and its closing, on a ground that says its kind: work that takes months, a thing done at once, what he cannot do yet. The rest is its gloss
        tileWidth: 148        # and the rows are tiles, as many to a line as fit at that width or more: three at 1320, more as the window widens
      # The Town page: it takes the choice's place in this panel once a life has explored the town
      # (LifeScene::showTown), as in life.yaml
      - kind: Layout:Vertical
        name: town
        width: 404
        height: 200
        scrollable: true
        spacing: 12
        children:
          - kind: PlaceGrid
            name: places
            width: 404
            tileWidth: 148
          - {kind: Label, name: marketHead, style: gloss-title, overflow: ellipsis, width: 404, text: "The Market"}
          - kind: ActivityList
            name: marketRows
            id: town.market
            width: 404
            stripes: false
            compact: true
            tileWidth: 148
          - {kind: Label, name: raised, style: label, color: ink-muted, overflow: wrap, width: 404, text: ""}
      # The Adventure page: it takes the choice's place in this column once he has somewhere to walk
      # to (LifeScene::showAdventure, lifewalk.cpp). The records of the walks he made by hand, then the
      # form of a queue: the chosen record walked again, so many times, with no fight fought
      - kind: Layout:Vertical
        name: adventure
        width: 404
        height: 200
        scrollable: true
        spacing: 16
        children:
          # -- Where to walk: a line a place he knows of, the open ones first. One is chosen; under
          # the list, what a walk by hand is, and the button that sets out for the one chosen --
          - kind: Panel
            name: zonePanel
            frame: plain
            width: 404
            heading: Where to walk
            aside: "2 OPEN · 1 CLOSED"
            children:
              # The places to walk to, as the town's places are shown: a tile each, a seal for
              # each level he knows it to
              - kind: PlaceGrid
                name: zones
                width: 404
                tileWidth: 148
              - kind: Layout:Horizontal
                name: zoneGo
                width: 372
                height: 36
                spacing: 12
                children:
                  - {kind: Label, name: zoneNote, style: gloss, color: ink-muted, overflow: ellipsis, width: 220, text: "A walk he chooses day by day. The record is kept."}
                  - {kind: Button, name: walkNew, variant: ochre, label: "Set out for the Hedgerows · 1 mo", tag: walk.new}

          # -- The walks kept of the place chosen: a table, the best first. One is chosen, and its
          # button walks it once --
          - kind: Panel
            name: recordsPanel
            frame: plain
            width: 404
            heading: Records of the Hedgerows
            aside: "1 KEPT"
            children:
              - kind: ActivityList
                name: records
                id: walk.records
                stripes: false
                framed: true
                headName: WALK       # the table's head, inside its frame over its lines
                headCost: COST
                headAside: BRINGS
              - {kind: Label, name: recordsNote, style: body-sm, color: ink-faint, overflow: wrap, text: "Not yet walked. The first walk is made by hand."}

          # -- Walk it again: the walk chosen, so many times. What the walks take, use, bring and
          # teach, each a figure and its caption; then the two buttons --
          - kind: Panel
            name: queuePanel
            frame: ruled
            width: 404
            heading: Walk it again
            aside: "THE WALK OF 9 Y 9 MO"
            children:
              - kind: Layout:Horizontal
                name: queueCount
                width: 372
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: timesHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: TIMES}
                  - {kind: Button, name: queueFewer, variant: quiet, label: "−", tag: walk.fewer}
                  - {kind: Label, name: queueTimes, style: figure, overflow: ellipsis, align: center, width: 28, text: "3"}
                  - {kind: Button, name: queueMore, variant: quiet, label: "+", tag: walk.more}
                  - {kind: Label, name: queueTotal, style: body-sm, color: ink-muted, overflow: ellipsis, width: 240, text: "· 3 mo · home at 12 y 2 mo"}
              - kind: Layout:Horizontal
                name: queueStopRow
                width: 372
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: stopHead, style: label, color: ink-muted, overflow: ellipsis, width: 86, text: STOP WHEN}
                  - {kind: Button, name: queueStop, variant: quiet, label: "Never · walk them all", tag: walk.stop}
              - {kind: Ornament, ornament: divider, knot: false}
              - kind: Layout:Horizontal
                name: forecast
                width: 372
                height: 62
                spacing: 12
                children:
                  - kind: Layout:Vertical
                    name: cellTake
                    width: 84
                    spacing: 2
                    children:
                      - {kind: Label, name: takeHead, style: label, color: ink-muted, width: 84, text: TAKES}
                      - {kind: Label, name: takeFigure, style: figure, color: status-time, overflow: ellipsis, width: 84, text: "3 mo"}
                      - {kind: Label, name: takeNote, style: caption, color: ink-muted, overflow: ellipsis, width: 84, text: "−9 vitality"}
                  - {kind: Shape2D, name: cellUseRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellUse
                    width: 84
                    spacing: 2
                    children:
                      - {kind: Label, name: useHead, style: label, color: ink-muted, width: 84, text: USES}
                      - {kind: Label, name: useFigure, style: figure, overflow: ellipsis, width: 84, text: "nothing"}
                      - {kind: Label, name: useNote, style: caption, color: ink-muted, overflow: ellipsis, width: 84, text: "from the bag"}
                  - {kind: Shape2D, name: cellBringRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellBring
                    width: 84
                    spacing: 2
                    children:
                      - {kind: Label, name: bringHead, style: label, color: ink-muted, width: 84, text: BRINGS}
                      - {kind: Label, name: bringFigure, style: figure, color: status-gain, overflow: ellipsis, width: 84, text: "+33"}
                      - {kind: Label, name: bringNote, style: caption, color: ink-muted, overflow: ellipsis, width: 84, text: "berries, rolled anew"}
                  - {kind: Shape2D, name: cellTeachRule, width: 1, height: 56, theme: activity.row.rule}
                  - kind: Layout:Vertical
                    name: cellTeach
                    width: 84
                    spacing: 2
                    children:
                      - {kind: Label, name: teachHead, style: label, color: ink-muted, width: 84, text: TEACHES}
                      - {kind: Label, name: teachFigure, style: figure, color: lapis, overflow: ellipsis, width: 84, text: "+9"}
                      - {kind: Label, name: teachNote, style: caption, color: ink-muted, overflow: ellipsis, width: 84, text: "study · level 3 at +6"}
              - {kind: Ornament, ornament: divider, knot: false}
              - {kind: Label, name: queueWarn, style: gloss, color: vermilion, overflow: wrap, text: ""}
              - kind: Layout:Horizontal
                name: queueGo
                width: 372
                height: 36
                spacing: 8
                children:
                  - {kind: Label, name: queueSpacer, style: label, overflow: ellipsis, width: 100, text: " "}
                  - {kind: Button, name: walkOnce, variant: quiet, label: "Walk once · 1 mo", tag: walk.once}
                  - {kind: Button, name: walkMany, variant: ochre, label: "Queue 3 · 3 mo", tag: walk.many}

          # -- While a queue runs, in the form's place: which walk of how many, how far along, and
          # the button that ends the queue with this walk --
          - kind: Panel
            name: workPanel
            frame: ruled
            width: 404
            heading: At work now
            children:
              - {kind: Label, name: atWalk, style: label, color: status-gain, overflow: wrap, text: "WALK 1 OF 3"}
              - {kind: ProgressRule, name: queueBar, nib: false, percent: 20, forecast: 100}
              - {kind: Button, name: queueLast, variant: quiet, label: "Finish this walk, then stop", tag: walk.last}

          # -- The foot: what the scribe says of the place, at his age. Never anything the game counts --
          - {kind: Label, name: footLine, style: gloss, color: ink-muted, overflow: wrap, width: 404, text: ""}

  # ── Side: one panel at a time ─────────────────────────────────────────────────
  - kind: Tabs
    name: sideTabs
    tag: life.side
    width: 320            # the hairline spans the column
    anchors:
      - {side: left, target: parts, targetSide: left}
      - {side: top, target: __MainWindow, targetSide: top, margin: 128}
    items:
      - {label: Stats}
      - {label: Inventory}
      - {label: Timeline}
      - {label: Log}

  - kind: Panel
    name: parts
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - {kind: StatLine, name: vit, glossKey: parts/vit, label: Vitality, glyph: vitality, value: 60, max: 150}
      - {kind: Ornament, ornament: divider, knot: false}
      - {kind: StatLine, name: str, glossKey: parts/str, label: Strength, glyph: strength, value: 15, max: 30}
      - {kind: StatLine, name: dex, glossKey: parts/dex, label: Dexterity, glyph: dexterity, value: 11, max: 30}
      - {kind: StatLine, name: int, glossKey: parts/int, label: Intelligence, glyph: intelligence, value: 9, max: 30}
      - {kind: Ornament, ornament: divider, knot: false}
      - kind: ResourceLedger
        name: skills

  - kind: Panel
    name: holds
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: ResourceLedger
        name: ledger

  - kind: Panel
    name: clockPanel
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: LifeClock
        name: clock
        startAge: 6
        endAge: 30
        age: 17.5
        milestones:
          - {age: 7}
          - {age: 13}
          - {age: 16}
          - {age: 21}
          - {age: 26}
          - {age: 30}

  - kind: Panel
    name: happened
    frame: ruled
    width: 320
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 24}
      - {side: top, target: __MainWindow, targetSide: top, margin: 180}
    children:
      - kind: EventLog
        name: log
        height: 300
        years: false          # no "IN HIS 14TH YEAR" over each year: a line's age says it, and the log keeps its room for the lines
        footnote: THE CHRONICLE IS WRITTEN FROM THIS LOG
