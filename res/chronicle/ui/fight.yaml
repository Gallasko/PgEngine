# A fight of a walk: it takes the on-site screen's place (expedition.yaml) and gives it back.
#
# Built by LifeScene (examples/Chronicle/Scenes/lifewalk.cpp) when a beast sought is found, and
# removed when he goes back to the woods. Layout and placeholder content only: every word and
# figure is rules/expedition.pg's, written by name (LifeScene::fillFight).
#
# Under a head and the order of the turn: what he fights, in a panel of its own across the top
# (each beast with how it stands and what it means to do to him), and under it, side by side and
# level, he himself (280) and his turn (the menu as tiles: what anyone can do, then what he has
# learned in his life; against a pack, the beasts to aim at over it). So the beasts are above and
# he is below. At the right (376), down the whole height, what the choice looked at would do,
# with the button that does it, over the account of the fight. A tile of the menu is chosen, then
# done by the button, which is always in view; a second click on the tile does it too.
#
# A blow is seen coming: his rule (heroCast) or the beast's (foeCast0..3) fills, then the blow is
# told in the account (LifeScene::runWalk).
# z: the Overlay band, 100-129 (the veil 100, the head and the panels 104, their content 114).
name: fight
children:

  - kind: Shape2D
    name: veil
    width: 1320
    height: 1020
    z: 100
    theme: scene.background

  # -- Head: what he fights, the turn, and what the fight costs the stay --
  - {kind: Label, name: kicker, x: 16, y: 10, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 760, text: "THE HOLLOW WOODS · DAY 12 · A FIGHT"}
  - {kind: Label, name: fightTitle, x: 16, y: 28, z: 104, style: heading, overflow: ellipsis, width: 760, text: Wolf pack}

  - kind: Label
    name: turn
    z: 104
    style: figure-xl
    overflow: ellipsis
    width: 240
    align: right
    text: "TURN 4"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 6}

  - kind: Label
    name: turnNote
    z: 104
    style: label
    color: status-time
    overflow: ellipsis
    width: 620
    align: right
    text: "FIGHT COST · 3 TURNS = 1 DAY · 2 DAYS SO FAR · 17 DAYS LEFT ON SITE"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 44}

  # -- The order of the turn: who acts when, and what is coming --
  - kind: Layout:Horizontal
    name: order
    x: 16
    y: 66
    z: 104
    width: 900
    height: 20
    spacing: 14
    children:
      - {kind: Label, name: chip0, z: 104, style: label, color: lapis, text: "ALDREN · NOW"}
      - {kind: Label, name: chip1, z: 104, style: label, color: ink, text: "→ FIRST WOLF · BITES"}
      - {kind: Label, name: chip2, z: 104, style: label, color: ink, text: "→ SECOND WOLF · CIRCLES"}
      - {kind: Label, name: chip3, z: 104, style: label, color: ink-muted, text: "→ THIRD WOLF · HANGS BACK"}
      - {kind: Label, name: chip4, z: 104, style: label, color: ink-muted, text: "→ ALDREN · A NEW DAY"}
      - {kind: Label, name: chip5, z: 104, style: label, color: ink-muted, text: ""}

  - {kind: Label, name: quick, x: 16, y: 90, z: 104, style: label, color: ink-muted, overflow: ellipsis, width: 620, text: "QUICKNESS 11 AGAINST 9: HE ACTS FIRST"}

  - kind: Label
    name: warn
    z: 104
    style: label
    color: vermilion
    overflow: ellipsis
    width: 520
    align: right
    text: "2 BITES COMING · 8–14 IF ALL LAND"
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 16}
      - {side: top, target: __MainWindow, targetSide: top, margin: 90}

  # -- Left and middle: what he fights across the top; under it he, and his turn beside him --
  - kind: Layout:Vertical
    name: walkLeft
    x: 16
    y: 118
    z: 104
    width: 920
    height: 880
    scrollable: true
    spacing: 12
    children:
      - kind: Panel
        name: foePanel
        frame: ruled
        width: 916
        z: 104
        contentZ: 114
        heading: Wolf pack
        glyph: adventure
        children:
          # What he fights, over him and over his turn: what it is, then each beast of it side by
          # side (four at most), with how it stands over its rule, what it means to do to him this
          # turn, and the rule of its blow, which fills before the blow is told. The scene gives
          # the blocks their width and hides the ones there is no beast for. Under them, what he
          # knows of it
          - {kind: Label, name: foeAbout, style: gloss, color: ink-muted, overflow: wrap, text: "Lean and grey. It never comes alone for long."}
          - kind: Layout:Horizontal
            name: foeRow
            height: 116
            spacing: 16
            children:
                - kind: Layout:Vertical
                  name: foeBlock0
                  width: 200
                  height: 116
                  spacing: 6
                  children:
                    - {kind: Label, name: foeName0, style: label, overflow: wrap, width: 200, text: "FIRST WOLF · 12 OF 16"}
                    - {kind: ProgressRule, name: foeBar0, nib: false, width: 200, percent: 75}
                    - {kind: Label, name: foeIntent0, style: label, color: vermilion, overflow: wrap, width: 200, text: "BITES THIS TURN · 2–4 IF IT LANDS"}
                    - {kind: ProgressRule, name: foeCast0, nib: false, small: true, width: 200, percent: 0}
                - kind: Layout:Vertical
                  name: foeBlock1
                  width: 200
                  height: 116
                  spacing: 6
                  children:
                    - {kind: Label, name: foeName1, style: label, overflow: wrap, width: 200, text: "SECOND WOLF · UNHURT"}
                    - {kind: ProgressRule, name: foeBar1, nib: false, width: 200, percent: 100}
                    - {kind: Label, name: foeIntent1, style: label, color: vermilion, overflow: wrap, width: 200, text: "CIRCLES: NOTHING FROM IT THIS TURN"}
                    - {kind: ProgressRule, name: foeCast1, nib: false, small: true, width: 200, percent: 0}
                - kind: Layout:Vertical
                  name: foeBlock2
                  width: 200
                  height: 116
                  spacing: 6
                  children:
                    - {kind: Label, name: foeName2, style: label, overflow: wrap, width: 200, text: "THIRD WOLF · UNHURT"}
                    - {kind: ProgressRule, name: foeBar2, nib: false, width: 200, percent: 100}
                    - {kind: Label, name: foeIntent2, style: label, color: vermilion, overflow: wrap, width: 200, text: "HANGS BACK WHILE TWO STAND"}
                    - {kind: ProgressRule, name: foeCast2, nib: false, small: true, width: 200, percent: 0}
                - kind: Layout:Vertical
                  name: foeBlock3
                  width: 200
                  height: 116
                  spacing: 6
                  children:
                    - {kind: Label, name: foeName3, style: label, overflow: wrap, width: 200, text: ""}
                    - {kind: ProgressRule, name: foeBar3, nib: false, width: 200, percent: 0}
                    - {kind: Label, name: foeIntent3, style: label, color: vermilion, overflow: wrap, width: 200, text: ""}
                    - {kind: ProgressRule, name: foeCast3, nib: false, small: true, width: 200, percent: 0}
          - kind: ResourceLedger
            name: foe

      - kind: Layout:Horizontal
        name: duelRow
        width: 916
        height: 620
        spacing: 12
        children:
          - kind: Panel
            name: heroPanel
            frame: ruled
            width: 280
            z: 104
            contentZ: 114
            heading: Aldren
            glyph: strength
            children:
              - {kind: Label, name: heroVit, style: label, overflow: wrap, text: "VITALITY 49 OF 90"}
              - {kind: ProgressRule, name: heroBar, nib: false, percent: 54}
              - {kind: Label, name: low, style: label, color: vermilion, overflow: wrap, text: ""}
              # His breath, for who has learned something to spend it on: out of the stack otherwise
              - {kind: Label, name: breath, style: label, color: lapis, overflow: wrap, text: "BREATH 3 OF 5"}
              - {kind: ProgressRule, name: breathBar, nib: false, small: true, percent: 60}
              # His blow, about to go: the rule fills, then the blow is told in the account
              - {kind: Label, name: heroMove, style: label, color: ink-muted, overflow: wrap, text: HIS BLOW}
              - {kind: ProgressRule, name: heroCast, nib: false, small: true, percent: 0}
              - kind: ResourceLedger
                name: hero

          - kind: Panel
            name: menuPanel
            frame: ruled
            width: 616
            z: 104
            contentZ: 114
            heading: His turn
            glyph: swordsmanship
            children:
              # Against several, the one aimed at is chosen here; against one there is nothing to choose
              - {kind: Label, name: aimNote, style: label, color: ink-muted, overflow: wrap, text: AIM AT}
              - kind: ActivityList
                name: targets
                id: walk.targets
                stripes: false
                compact: true
                tileWidth: 148
              - kind: ActivityList
                name: menu
                id: walk.menu
                stripes: false
                compact: true
                tileWidth: 148

  # -- Right: what the choice looked at would do, with the button that does it, then the account --
  - kind: Layout:Vertical
    name: walkRight
    z: 104
    width: 380
    height: 880
    scrollable: true
    spacing: 12
    anchors:
      - {side: right, target: __MainWindow, targetSide: right, margin: 12}
      - {side: top, target: __MainWindow, targetSide: top, margin: 118}
    children:
      - kind: Panel
        name: previewPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: If he does this
        glyph: quill
        children:
          - {kind: Label, name: previewTitle, style: title, overflow: wrap, text: Heavy cut}
          - {kind: Label, name: previewText, style: body, overflow: wrap, text: "A slow, full blow."}
          - kind: ResourceLedger
            name: preview
          - {kind: Label, name: odds, style: gloss, color: ink-muted, overflow: wrap, text: "Kills it thrice in 5. A miss means a free bite."}
          - kind: Button
            name: act
            variant: seal
            label: Strike
            glyph: swordsmanship
            tag: walk.act
          - kind: Button
            name: hand
            variant: quiet
            label: "Let the stance choose, this turn and after"
            glyph: time
            tag: walk.hand

      - kind: Panel
        name: accountPanel
        frame: ruled
        width: 376
        z: 104
        contentZ: 114
        heading: The account
        glyph: quill
        children:
          - kind: EventLog
            name: account
            height: 360
            years: false
            steps: true          # the first column counts: a step of the record, a turn of the fight
          - {kind: Label, name: footnote, style: label, color: status-time, overflow: wrap, text: "WRITTEN SO FAR · 2 DAYS · −14 VITALITY · A RETREAT KEEPS THE DAYS"}
